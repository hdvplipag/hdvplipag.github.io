<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>azlinks</title>
    <!-- Favicon Moderno -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%232563eb'/><path d='M30 50l20-20v15h20v10H50v15z' fill='%23ffffff'/><circle cx='70' cy='70' r='8' fill='%2360a5fa'/></svg>">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="azlinks-192x192.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Segoe UI"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background-color: #f3f3f3; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cdcdcd; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a6a6a6; }

        button, [onclick] {
            touch-action: manipulation;
            cursor: pointer;
        }

        .category-scroll {
            max-height: calc(100dvh - 70px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .safe-bottom-padding {
            padding-bottom: calc(env(safe-area-inset-bottom) + 6rem) !important;
        }

        footer {
            padding-bottom: max(0.625rem, env(safe-area-inset-bottom));
        }

        @media (min-width: 768px) {
            .desktop-logo-text { font-size: 32px !important; }
            .desktop-logo-svg { width: 190px !important; height: 46px !important; }
            .category-scroll { max-height: calc(100vh - 100px); }
            .safe-bottom-padding { padding-bottom: 2rem !important; }
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] min-h-[100dvh] font-sans overflow-hidden text-slate-800">

    <!-- Barra Superior -->
    <header class="bg-white/90 backdrop-blur-md border-b border-gray-200 p-3 flex flex-col items-start md:items-stretch gap-3 shadow-sm z-20 shrink-0">
        <div class="flex items-center justify-between w-full">
            <div class="flex items-center gap-2">
                <div class="flex items-center cursor-pointer select-none shrink-0 self-center" onclick="window.location.reload()">
                    <svg class="desktop-logo-svg" width="140" height="34" viewBox="0 0 180 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="10" fill="#2563EB"/>
                        <path d="M12 28L20 14L28 28H23.5L20 21.5L16.5 28H12Z" fill="white"/>
                        <path d="M15 25H25" stroke="white" stroke-width="2"/>
                        <text class="desktop-logo-text" x="48" y="28" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="22" fill="#1E293B">AZ<tspan fill="#2563EB">Links</tspan></text>
                    </svg>
                </div>
            </div>

            <!-- Botões Desktop -->
            <div class="hidden md:flex items-center justify-end w-full gap-2">
                <button type="button" onclick="openModal()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-md text-sm font-medium shadow-sm transition-all cursor-pointer">
                    <i class="fa-solid fa-plus pointer-events-none"></i> <span class="pointer-events-none">Novo</span>
                </button>

                <!-- Botão de Ordenação Desktop -->
                <button type="button" onclick="toggleSortOrder()" title="Ordenar A-Z / Z-A" id="btnSortDesk" class="p-2 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:bg-gray-200 transition-all flex items-center justify-center cursor-pointer">
                    <i id="sortIconDesk" class="fa-solid fa-arrow-down-a-z pointer-events-none"></i>
                </button>

                <div class="flex items-center bg-gray-100 border border-gray-200 rounded p-0.5 gap-0.5">
                    <button type="button" onclick="setViewMode('grid')" title="Visualização em Grade" id="btnGridDesk" class="p-1.5 text-xs rounded text-gray-700 hover:bg-white transition-all cursor-pointer">
                        <i class="fa-solid fa-border-all"></i>
                    </button>
                    <button type="button" onclick="setViewMode('list')" title="Visualização em Lista" id="btnListDesk" class="p-1.5 text-xs rounded text-gray-700 hover:bg-white transition-all cursor-pointer">
                        <i class="fa-solid fa-list"></i>
                    </button>
                </div>

                <button type="button" onclick="syncFromGoogleSheets()" title="Forçar sincronização" class="p-2 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:bg-gray-200 hover:text-blue-600 transition-all flex items-center justify-center cursor-pointer">
                    <i id="syncIconDesk" class="fa-solid fa-rotate-right pointer-events-none"></i>
                </button>
            </div>
        </div>

        <!-- Linha de Pesquisa e Botões Mobile -->
        <div class="flex items-center justify-between w-full gap-2">
            <div class="hidden md:flex items-center gap-2 flex-1">
                <button type="button" onclick="toggleMobileSidebar()" title="Menu" class="p-2 text-gray-600 hover:text-blue-600 focus:outline-none rounded-md hover:bg-gray-100 transition-colors shrink-0 cursor-pointer">
                    <i class="fa-solid fa-bars text-lg pointer-events-none"></i>
                </button>
                <div class="relative w-full">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInputDesktop" placeholder="Pesquisar atalhos..." 
                           class="w-full pl-9 pr-8 py-1.5 bg-gray-50 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all search-input">
                    <button type="button" onclick="clearSearch()" class="clear-search-btn absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden text-sm"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <!-- Botões Mobile -->
            <div class="flex md:hidden items-center justify-between w-full overflow-x-auto pb-1 gap-2">
                <button type="button" onclick="openModal()" class="flex items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1.5 rounded-md text-xs font-medium shrink-0 cursor-pointer"><i class="fa-solid fa-plus pointer-events-none"></i> <span class="pointer-events-none">Novo</span></button>
                
                <div class="flex items-center gap-1.5 shrink-0">
                    <!-- Botão de Ordenação Mobile -->
                    <button type="button" onclick="toggleSortOrder()" title="Ordenar A-Z / Z-A" id="btnSortMob" class="p-2 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:bg-gray-200 transition-all flex items-center justify-center shrink-0 cursor-pointer">
                        <i id="sortIconMob" class="fa-solid fa-arrow-down-a-z pointer-events-none"></i>
                    </button>

                    <div class="flex items-center bg-gray-100 border border-gray-200 rounded p-0.5 gap-0.5 shrink-0">
                        <button type="button" onclick="setViewMode('grid')" title="Grade" id="btnGridMob" class="p-1.5 text-xs rounded text-gray-700 hover:bg-white transition-all cursor-pointer">
                            <i class="fa-solid fa-border-all"></i>
                        </button>
                        <button type="button" onclick="setViewMode('list')" title="Lista" id="btnListMob" class="p-1.5 text-xs rounded text-gray-700 hover:bg-white transition-all cursor-pointer">
                            <i class="fa-solid fa-list"></i>
                        </button>
                    </div>

                    <button type="button" onclick="syncFromGoogleSheets()" title="Forçar sincronização" class="p-2 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:text-blue-600 transition-all flex items-center justify-center shrink-0 cursor-pointer">
                        <i id="syncIconMob" class="fa-solid fa-rotate-right pointer-events-none"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Pesquisa Mobile -->
        <div class="flex md:hidden items-center gap-2 w-full">
            <button type="button" onclick="toggleMobileSidebar()" title="Menu" class="p-2 text-gray-600 hover:text-blue-600 focus:outline-none rounded-md hover:bg-gray-100 transition-colors shrink-0 cursor-pointer">
                <i class="fa-solid fa-bars text-lg pointer-events-none"></i>
            </button>
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="searchInputMobile" placeholder="Pesquisar atalhos..." 
                       class="w-full pl-9 pr-8 py-1.5 bg-gray-50 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all search-input">
                <button type="button" onclick="clearSearch()" class="clear-search-btn absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <!-- Cabeçalho Categoria -->
        <div class="flex items-center justify-between bg-white px-4 py-2 rounded-lg border border-gray-200/80 shadow-sm w-full">
            <h2 id="currentCategoryTitle" class="font-semibold text-gray-800 text-xs md:text-base flex items-center gap-2">
                <i class="fa-solid fa-folder-open text-blue-600"></i> Todos os Atalhos
            </h2>
            <div class="flex items-center gap-2">
                <span id="syncIndicator" class="hidden text-[10px] text-amber-600 bg-amber-50 px-2 py-0.5 rounded border border-amber-200 items-center gap-1">
                    <i class="fa-solid fa-sync fa-spin"></i> Sincronizando...
                </span>
                <span id="currentCategoryCount" class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-0.5 rounded-full">0 itens</span>
                
                <!-- Botão Três Pontinhos (Exibido apenas na Categoria Todos) -->
                <div id="categoryHeaderMoreContainer" class="relative dropdown-container shrink-0 hidden">
                    <button type="button" id="btnHeaderMore" title="Mais opções" class="p-1.5 text-xs rounded bg-gray-100 border border-gray-200 text-gray-700 hover:text-blue-600 transition-all flex items-center justify-center cursor-pointer">
                        <i class="fa-solid fa-ellipsis-vertical pointer-events-none"></i>
                    </button>
                    <div id="headerMoreDropdown" class="absolute right-0 mt-1 w-44 bg-white border border-gray-200 rounded-md shadow-lg hidden z-30 py-1 text-xs">
                        <button onclick="exportBackup(); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-gray-700 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-download text-gray-400"></i> Exportar</button>
                        <button onclick="triggerImportBackup(); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-gray-700 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-upload text-gray-400"></i> Importar</button>
                        <button onclick="confirmClearAllShortcuts(); closeAllDropdowns();" class="w-full text-left px-3 py-1.5 text-red-600 hover:bg-gray-100 flex items-center gap-2"><i class="fa-solid fa-trash text-red-500"></i> Remover Todos</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        <aside id="sidebar" onmouseenter="expandSidebar()" onmouseleave="collapseSidebar()" 
               class="fixed inset-y-0 left-0 -translate-x-full md:translate-x-0 md:relative bg-gray-50/95 backdrop-blur-md border-r border-gray-200 p-3 flex flex-col justify-between transition-all duration-300 w-64 md:w-16 z-40 md:z-30 shadow-lg md:shadow-none max-h-[100dvh]">
            <div class="flex flex-col gap-1 w-full category-scroll pb-16 md:pb-0">
                <div class="flex items-center justify-between mb-2 px-1 border-b border-gray-200/60 pb-2 md:hidden">
                    <div id="sidebarTitle" class="text-xs font-bold text-gray-500 uppercase tracking-wider truncate">FILTROS</div>
                    <button type="button" onclick="toggleMobileSidebar()" class="text-gray-500 hover:text-gray-800 md:hidden p-1"><i class="fa-solid fa-xmark text-base"></i></button>
                </div>
                <div id="categoryList" class="flex flex-col gap-1 mt-1"></div>
            </div>
        </aside>

        <div id="sidebarOverlay" onclick="collapseSidebar()" class="fixed inset-0 bg-black/40 z-30 hidden"></div>

        <main class="flex-1 flex flex-col p-3 md:p-4 overflow-y-auto safe-bottom-padding gap-4">
            <div id="shortcutsGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-7 xl:grid-cols-8 gap-3"></div>
            <div id="shortcutsList" class="hidden flex flex-col bg-white rounded-lg border border-gray-200 shadow-sm overflow-visible"></div>
            
            <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center text-center p-8 text-gray-400">
                <i class="fa-regular fa-folder-open text-5xl mb-3 text-gray-300"></i>
                <p class="text-base font-medium">Nenhum atalho encontrado</p>
            </div>
        </main>
    </div>

    <!-- Rodapé -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-4 py-2.5 flex items-center justify-between text-xs text-gray-500 z-40 shadow-md md:relative">
        <div onclick="openEmailModal(true)" title="Trocar de e-mail" class="flex items-center gap-2 truncate cursor-pointer hover:text-blue-600 transition-colors w-full justify-center md:justify-start">
            <i class="fa-solid fa-shield-halved text-blue-600 shrink-0"></i>
            <span class="truncate">Licenciado para: <strong id="footerLicenseName" class="text-gray-700">Sebastião Torquato</strong></span>
        </div>
    </footer>

    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="handleImportBackup(event)">
    <input type="file" id="shortcutIconFileInput" accept="image/*" class="hidden" onchange="handleShortcutIconFileSelect(event)">
    <input type="file" id="categoryIconFileInput" accept="image/*" class="hidden" onchange="handleCategoryIconFileSelect(event)">

    <!-- Tela de licença vencida -->
    <div id="licenseBlock" class="fixed inset-0 bg-white z-[70] hidden flex items-center justify-center p-6">
        <div class="w-full max-w-md border-2 border-red-500 rounded-lg p-6 flex flex-col items-center text-center gap-4">
            <i class="fa-solid fa-lock text-red-500 text-4xl"></i>
            <p id="licenseBlockMessage" class="text-red-600 font-semibold text-lg leading-snug"></p>
            <button type="button" onclick="useAnotherEmail()" class="mt-2 px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-md font-medium">Entrar com outro e-mail</button>
        </div>
    </div>

    <!-- Modal de acesso por e-mail -->
    <div id="emailModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden border border-gray-100">
            <div class="bg-gray-50 px-5 py-3 border-b border-gray-200">
                <h3 class="font-semibold text-gray-800 text-sm flex items-center gap-2"><i class="fa-solid fa-envelope text-blue-600"></i> Acessar com e-mail</h3>
            </div>
            <form onsubmit="handleEmailSubmit(event)" class="p-5 flex flex-col gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">E-mail cadastrado *</label>
                    <input type="email" id="loginEmail" required autocomplete="email" autocapitalize="none" class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Senha *</label>
                    <input type="password" id="loginPassword" required maxlength="8" class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <p id="loginEmailError" class="hidden text-xs text-red-600 mt-0.5"></p>
                <div class="flex items-center justify-end gap-2 mt-2 pt-3 border-t">
                    <button type="button" id="emailCancelBtn" onclick="closeEmailModal()" class="hidden px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-md">Cancelar</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-md font-medium">Entrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Adicionar Atalho -->
    <div id="shortcutModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-100">
            <div class="bg-gray-50 px-5 py-3 border-b border-gray-200 flex items-center justify-between">
                <h3 class="font-semibold text-gray-800 text-sm flex items-center gap-2"><i class="fa-solid fa-file-code text-blue-600"></i> Adicionar Atalho</h3>
                <button type="button" onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleFormSubmit(event)" class="p-5 flex flex-col gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Título do Atalho *</label>
                    <input type="text" id="shortcutTitle" required class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Link ou URL *</label>
                    <input type="text" id="fileName" required autocomplete="off" autocapitalize="none" spellcheck="false" class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div id="shortcutCategoryWrapper">
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Categoria *</label>
                    <input type="text" id="shortcutCategory" list="categorySuggestions" class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <datalist id="categorySuggestions"></datalist>
                </div>

                <!-- Checkboxes de Favorito e Dispositivos -->
                <div class="flex flex-wrap items-center gap-4 py-1.5 border-t border-b border-gray-100 my-1">
                    <div class="flex items-center gap-1.5">
                        <input type="checkbox" id="shortcutFavorite" class="w-4 h-4 text-amber-500 rounded border-gray-300 focus:ring-amber-400">
                        <label for="shortcutFavorite" class="text-xs font-semibold text-gray-700 cursor-pointer flex items-center gap-1"><i class="fa-solid fa-star text-amber-400"></i> Favoritos</label>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <input type="checkbox" id="shortcutDesktop" checked class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                        <label for="shortcutDesktop" class="text-xs font-semibold text-gray-700 cursor-pointer flex items-center gap-1"><i class="fa-solid fa-desktop text-gray-500"></i> Computador</label>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <input type="checkbox" id="shortcutMobile" checked class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                        <label for="shortcutMobile" class="text-xs font-semibold text-gray-700 cursor-pointer flex items-center gap-1"><i class="fa-solid fa-mobile-screen-button text-gray-500"></i> Celular</label>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-2 mt-2 pt-3 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-md">Cancelar</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-md font-medium">Adicionar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Editar Atalho -->
    <div id="editShortcutModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-100">
            <div class="bg-gray-50 px-5 py-3 border-b border-gray-200 flex items-center justify-between">
                <h3 class="font-semibold text-gray-800 text-sm flex items-center gap-2"><i class="fa-solid fa-pen text-blue-600"></i> Editar Atalho</h3>
                <button type="button" onclick="closeEditShortcutModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleEditFormSubmit(event)" class="p-5 flex flex-col gap-3">
                <input type="hidden" id="editOriginalId">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Título do Atalho *</label>
                    <input type="text" id="editShortcutTitle" required class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Link ou URL *</label>
                    <input type="text" id="editFileName" required autocomplete="off" autocapitalize="none" spellcheck="false" class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Categoria *</label>
                    <input type="text" id="editShortcutCategory" required list="categorySuggestions" class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- Checkboxes de Favorito e Dispositivos (Editar) -->
                <div class="flex flex-wrap items-center gap-4 py-1.5 border-t border-b border-gray-100 my-1">
                    <div class="flex items-center gap-1.5">
                        <input type="checkbox" id="editShortcutFavorite" class="w-4 h-4 text-amber-500 rounded border-gray-300 focus:ring-amber-400">
                        <label for="editShortcutFavorite" class="text-xs font-semibold text-gray-700 cursor-pointer flex items-center gap-1"><i class="fa-solid fa-star text-amber-400"></i> Favoritos</label>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <input type="checkbox" id="editShortcutDesktop" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                        <label for="editShortcutDesktop" class="text-xs font-semibold text-gray-700 cursor-pointer flex items-center gap-1"><i class="fa-solid fa-desktop text-gray-500"></i> Computador</label>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <input type="checkbox" id="editShortcutMobile" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                        <label for="editShortcutMobile" class="text-xs font-semibold text-gray-700 cursor-pointer flex items-center gap-1"><i class="fa-solid fa-mobile-screen-button text-gray-500"></i> Celular</label>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-2 mt-2 pt-3 border-t">

    <script>document.write('<script src="usuarios.js?t=' + Date.now() + '"><\/script>');</script>
    <script>
        let APPS_SCRIPT_URL = '';
        let APPS_SCRIPT_PLANILHA = '';
        const APPS_SCRIPT_URL_PLACEHOLDER = 'SUA_URL_DO_APPS_SCRIPT_AQUI';

        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        function isSyncConfigured() {
            return !!APPS_SCRIPT_URL && APPS_SCRIPT_URL !== APPS_SCRIPT_URL_PLACEHOLDER;
        }

        function normalizeUrl(value) {
            const v = String(value || '').trim();
            if (!v) return '';
            return /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(v) ? v : 'https://' + v;
        }

        function getFaviconUrl(targetUrl) {
            try {
                return `https://www.google.com/s2/favicons?domain=${new URL(targetUrl).hostname}&sz=128`;
            } catch (err) {
                return 'https://via.placeholder.com/32';
            }
        }

        function generateUniqueId() {
            return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function shareShortcut(itemId) {
            const item = htmlFiles.find(f => f.id === itemId);
            if (!item) return;

            const title = item.title || item.name || 'Atalho';
            const url = item.file || item.name;

            if (navigator.share) {
                navigator.share({
                    title: title,
                    text: title,
                    url: url
                }).catch((err) => {
                    console.log('Compartilhamento cancelado ou não suportado:', err);
                });
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    alert('Link copiado para a área de transferência!');
                }).catch(() => {
                    alert('Não foi possível compartilhar automaticamente. Link: ' + url);
                });
            }
        }

        let htmlFiles = [];
        let categoryCustomizations = {};
        let currentCategory = 'favorites';
        let searchQuery = '';
        let categoryViewModes = JSON.parse(localStorage.getItem('local_category_view_modes')) || {};
        let categorySortOrders = JSON.parse(localStorage.getItem('local_category_sort_orders')) || {};
        let sidebarOpen = false;
        let itemToDeleteId = null;
        let editingShortcutIconId = null;
        let isSyncing = false;
        let syncInterval = null;

        const availableCategoryIcons = [
            { icon: 'fa-solid fa-house', color: 'text-amber-500' },
            { icon: 'fa-solid fa-cart-shopping', color: 'text-emerald-500' },
            { icon: 'fa-solid fa-brain', color: 'text-purple-500' },
            { icon: 'fa-solid fa-newspaper', color: 'text-blue-500' },
            { icon: 'fa-solid fa-video', color: 'text-red-500' },
            { icon: 'fa-solid fa-briefcase', color: 'text-indigo-500' },
            { icon: 'fa-solid fa-wrench', color: 'text-cyan-600' },
            { icon: 'fa-solid fa-users', color: 'text-pink-500' },
            { icon: 'fa-solid fa-star', color: 'text-amber-400' },
            { icon: 'fa-solid fa-code', color: 'text-teal-600' }
        ];

        const categoryKeywordMap = {
            'geral': 0, 'home': 0,
            'loja': 1, 'lojas': 1, 'compras': 1,
            'ia': 2, 'ai': 2, 'inteligência': 2,
            'noticia': 3, 'notícias': 3, 'news': 3,
            'canal': 4, 'canais': 4, 'video': 4, 'youtube': 4,
            'trabalho': 5, 'work': 5,
            'ferramenta': 6, 'ferramentas': 6,
            'social': 7, 'redes': 7,
            'favorito': 8, 'favoritos': 8,
            'dev': 9, 'programação': 9
        };

        function getCategoryIcon(catName) {
            if (!catName) return 'fa-solid fa-folder text-blue-500';
            if (catName === 'most_visited') return 'fa-solid fa-fire text-amber-500';
            if (catName === 'favorites') return 'fa-solid fa-star text-amber-400';

            if (categoryCustomizations[catName] && categoryCustomizations[catName].icon) {
                return categoryCustomizations[catName].icon;
            }

            const name = catName.trim().toLowerCase();
            if (name === 'todos') return 'fa-solid fa-border-all text-blue-600';
            
            for (let keyword in categoryKeywordMap) {
                if (name.includes(keyword)) {
                    const item = availableCategoryIcons[categoryKeywordMap[keyword]];
                    return `${item.icon} ${item.color}`;
                }
            }
            return 'fa-solid fa-folder text-blue-500';
        }

        let pendingSyncCount = 0;

        function beginSync() {
            pendingSyncCount++;
            const indicator = document.getElementById('syncIndicator');
            if (indicator) indicator.classList.remove('hidden');
        }

        function endSync() {
            pendingSyncCount = Math.max(0, pendingSyncCount - 1);
            if (pendingSyncCount === 0) {
                const indicator = document.getElementById('syncIndicator');
                if (indicator) indicator.classList.add('hidden');
            }
        }

        function fetchWithTimeout(url, options = {}, timeoutMs = 15000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            return fetch(url, { ...options, signal: controller.signal })
                .finally(() => clearTimeout(timer));
        }

        // ===== Armazenamento local em IndexedDB =====
        const LOCAL_DB_NAME = 'azlinks_db';
        const LOCAL_DB_STORE = 'kv';
        let localDbPromise = null;
        let pendingPush = false;   // há alterações locais ainda não enviadas à planilha
        let localVersion = 0;      // incrementa a cada alteração local a sincronizar

        function openLocalDB() {
            if (localDbPromise) return localDbPromise;
            localDbPromise = new Promise((resolve, reject) => {
                if (!window.indexedDB) return reject(new Error('IndexedDB indisponível'));
                const req = indexedDB.open(LOCAL_DB_NAME, 1);
                req.onupgradeneeded = () => req.result.createObjectStore(LOCAL_DB_STORE);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
            return localDbPromise;
        }

        async function idbGet(key) {
            try {
                const db = await openLocalDB();
                return await new Promise((resolve, reject) => {
                    const q = db.transaction(LOCAL_DB_STORE, 'readonly').objectStore(LOCAL_DB_STORE).get(key);
                    q.onsuccess = () => resolve(q.result);
                    q.onerror = () => reject(q.error);
                });
            } catch (err) {
                const v = localStorage.getItem('idbfb_' + key); // reserva se IndexedDB falhar
                return v === null ? undefined : v;
            }
        }

        // Recebe um objeto { chave: texto } e grava tudo em uma única transação
        async function idbSetMany(obj) {
            try {
                const db = await openLocalDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(LOCAL_DB_STORE, 'readwrite');
                    const store = tx.objectStore(LOCAL_DB_STORE);
                    Object.keys(obj).forEach(k => store.put(obj[k], k));
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                    tx.onabort = () => reject(tx.error);
                });
            } catch (err) {
                console.error('Erro ao gravar no IndexedDB, usando reserva:', err);
                try { Object.keys(obj).forEach(k => localStorage.setItem('idbfb_' + k, obj[k])); } catch (e) {}
            }
        }

        async function loadLocalData() {
            const [s, c, d] = await Promise.all([idbGet('shortcuts'), idbGet('categories'), idbGet('dirty')]);
            try {
                if (s !== undefined) {
                    htmlFiles = JSON.parse(s) || [];
                    categoryCustomizations = JSON.parse(c || '{}') || {};
                    pendingPush = d === 'true';
                    return;
                }
                // Primeira execução: migra dados antigos do localStorage
                htmlFiles = JSON.parse(localStorage.getItem('local_html_shortcuts')) || [];
                categoryCustomizations = JSON.parse(localStorage.getItem('local_category_customizations')) || {};
                await idbSetMany({
                    shortcuts: JSON.stringify(htmlFiles),
                    categories: JSON.stringify(categoryCustomizations),
                    dirty: 'false'
                });
                localStorage.removeItem('local_html_shortcuts');
                localStorage.removeItem('local_category_customizations');
            } catch (err) {
                console.error('Erro ao ler dados locais:', err);
                htmlFiles = [];
                categoryCustomizations = {};
            }
        }

        async function syncToGoogleSheets() {
            if (!isSyncConfigured() || isSyncing || !navigator.onLine) return;
            isSyncing = true;
            beginSync();
            const versionAtStart = localVersion;
            try {
                await fetchWithTimeout(APPS_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        shortcuts: htmlFiles, 
                        categories: categoryCustomizations, 
                        planilha: APPS_SCRIPT_PLANILHA 
                    })
                });
                if (versionAtStart === localVersion) {
                    pendingPush = false;
                    idbSetMany({ dirty: 'false' });
                }
            } catch (err) {
                console.error("Erro ao sincronizar envio (será tentado novamente):", err);
            } finally {
                isSyncing = false;
                endSync();
                // houve alteração durante o envio: envia de novo
                if (pendingPush && versionAtStart !== localVersion) setTimeout(syncToGoogleSheets, 0);
            }
        }

        async function syncFromGoogleSheets() {
            if (!isSyncConfigured()) return;
            // Alterações feitas offline vão primeiro para a planilha, para não serem sobrescritas
            if (pendingPush) {
                await syncToGoogleSheets();
                if (pendingPush) return;
            }
            if (isSyncing || !navigator.onLine) return;
            const versionAtStart = localVersion;
            const iconDesk = document.getElementById('syncIconDesk');
            const iconMob = document.getElementById('syncIconMob');

            isSyncing = true;
            beginSync();
            if (iconDesk) iconDesk.classList.add('fa-spin');
            if (iconMob) iconMob.classList.add('fa-spin');

            try {
                const timestamp = Date.now();
                let getUrl = APPS_SCRIPT_URL;
                if (APPS_SCRIPT_PLANILHA) {
                    getUrl += (getUrl.includes('?') ? '&' : '?') + 'planilha=' + encodeURIComponent(APPS_SCRIPT_PLANILHA) + '&_t=' + timestamp;
                } else {
                    getUrl += (getUrl.includes('?') ? '&' : '?') + '_t=' + timestamp;
                }

                const res = await fetchWithTimeout(getUrl);
                const data = await res.json();
                
                if (data.status === "success" && !pendingPush && versionAtStart === localVersion) {
                    let changed = false;
                    
                    if (Array.isArray(data.shortcuts)) {
                        const parsedShortcuts = data.shortcuts.map(s => ({
                            ...s,
                            showDesktop: s.showDesktop !== false,
                            showMobile: s.showMobile !== false
                        }));
                        const newShortcutsStr = JSON.stringify(parsedShortcuts);
                        if (newShortcutsStr !== JSON.stringify(htmlFiles)) {
                            htmlFiles = parsedShortcuts;
                            idbSetMany({ shortcuts: JSON.stringify(htmlFiles) });
                            changed = true;
                        }
                    }

                    if (data.categories && typeof data.categories === 'object') {
                        const newCatStr = JSON.stringify(data.categories);
                        if (newCatStr !== JSON.stringify(categoryCustomizations)) {
                            categoryCustomizations = data.categories;
                            idbSetMany({ categories: JSON.stringify(categoryCustomizations) });
                            changed = true;
                        }
                    }

                    if (changed) {
                        render();
                    }
                }
            } catch (err) {
                console.error("Erro ao puxar dados do Sheets:", err);
            } finally {
                isSyncing = false;
                endSync();
                if (iconDesk) iconDesk.classList.remove('fa-spin');
                if (iconMob) iconMob.classList.remove('fa-spin');
            }
        }

        function startAutoSync() {
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(() => {
                if (!document.hidden) {
                    syncFromGoogleSheets();
                }
            }, 10000);
        }

        function saveToStorage(syncNow = true) {
            const snapshot = {
                shortcuts: JSON.stringify(htmlFiles),
                categories: JSON.stringify(categoryCustomizations)
            };
            if (syncNow) {
                localVersion++;
                pendingPush = true;
                snapshot.dirty = 'true';
            }
            idbSetMany(snapshot);
            localStorage.setItem('local_category_view_modes', JSON.stringify(categoryViewModes));
            localStorage.setItem('local_category_sort_orders', JSON.stringify(categorySortOrders));
            if (syncNow) {
                syncToGoogleSheets();
            }
        }

        function openShortcut(url, itemId) {
            if (itemId) {
                const item = htmlFiles.find(f => f.id === itemId);
                if (item) {
                    item.visitCount = (item.visitCount || 0) + 1;
                    saveToStorage(true);
                    render();
                }
            }
            window.open(url, '_blank');
        }

        function toggleFavorite(event, itemId) {
            event.stopPropagation();
            const item = htmlFiles.find(f => f.id === itemId);
            if (item) {
                item.isFavorite = !item.isFavorite;
                saveToStorage(true);
                render();
            }
        }

        const searchInputs = document.querySelectorAll('.search-input');
        const clearBtns = document.querySelectorAll('.clear-search-btn');
        
        searchInputs.forEach(input => {
            input.addEventListener('input', e => {
                searchQuery = e.target.value.toLowerCase();
                searchInputs.forEach(inp => inp.value = e.target.value);
                clearBtns.forEach(btn => btn.classList.toggle('hidden', searchQuery.length === 0));
                renderGrid();
            });
        });

        function clearSearch() { 
            searchQuery = ''; 
            searchInputs.forEach(inp => inp.value = '');
            clearBtns.forEach(btn => btn.classList.add('hidden')); 
            renderGrid(); 
        }

        function toggleMobileSidebar() { 
            sidebarOpen = !sidebarOpen; 
            applySidebarState(); 
        }

        function expandSidebar() { if(window.innerWidth >= 768) { sidebarOpen = true; applySidebarState(); } }
        function collapseSidebar() { sidebarOpen = false; applySidebarState(); }

        function applySidebarState() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const textElements = document.querySelectorAll('.sidebar-text');

            if (window.innerWidth >= 768) {
                if (sidebarOpen) {
                    sidebar.classList.replace('md:w-16', 'md:w-64');
                    textElements.forEach(el => el.classList.remove('md:hidden'));
                } else {
                    sidebar.classList.replace('md:w-64', 'md:w-16');
                    textElements.forEach(el => el.classList.add('md:hidden'));
                }
                overlay.classList.add('hidden');
            } else {
                if (sidebarOpen) {
                    sidebar.classList.replace('-translate-x-full', 'translate-x-0');
                    overlay.classList.remove('hidden');
                } else {
                    sidebar.classList.replace('translate-x-0', '-translate-x-full');
                    overlay.classList.add('hidden');
                }
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderCategories();
            applySidebarState();
            renderGrid();
            if (window.innerWidth < 768) collapseSidebar();
        }

        function updateCategoryHeader() {
            const titleEl = document.getElementById('currentCategoryTitle');
            const headerMoreContainer = document.getElementById('categoryHeaderMoreContainer');
            if (!titleEl) return;

            let label, iconClass;
            if (currentCategory === 'all') {
                label = 'Todos os Atalhos';
                iconClass = 'fa-solid fa-folder-open text-blue-600';
            } else if (currentCategory === 'favorites') {
                label = 'Favoritos';
                iconClass = 'fa-solid fa-star text-amber-400';
            } else if (currentCategory === 'most_visited') {
                label = 'Mais Visitados';
                iconClass = 'fa-solid fa-fire text-amber-500';
            } else {
                label = currentCategory;
                iconClass = getCategoryIcon(currentCategory);
            }

            titleEl.innerHTML = '';
            const custom = categoryCustomizations[currentCategory];
            const isSystemCat = ['all', 'favorites', 'most_visited'].includes(currentCategory);
            let icon;
            if (!isSystemCat && custom && custom.image) {
                icon = document.createElement('img');
                icon.src = custom.image;
                icon.alt = '';
                icon.className = 'w-4 h-4 object-contain rounded';
            } else {
                icon = document.createElement('i');
                icon.className = iconClass;
            }
            titleEl.appendChild(icon);
            titleEl.appendChild(document.createTextNode(' ' + label));

            // Exibe o botão de três pontinhos no cabeçalho apenas se a categoria for "Todos" (all)
            if (headerMoreContainer) {
                if (currentCategory === 'all') {
                    headerMoreContainer.classList.remove('hidden');
                } else {
                    headerMoreContainer.classList.add('hidden');
                }
            }
        }

        function setViewMode(mode) {
            categoryViewModes[currentCategory] = mode;
            saveToStorage(false);
            renderGrid();
        }

        function getViewMode(cat) {
            return categoryViewModes[cat] || 'grid';
        }

        function getSortOrder(cat) {
            return categorySortOrders[cat] || 'asc';
        }

        function toggleSortOrder() {
            const current = getSortOrder(currentCategory);
            categorySortOrders[currentCategory] = current === 'asc' ? 'desc' : 'asc';
            saveToStorage(false);
            renderGrid();
        }

        function updateSortButtonStyle() {
            const order = getSortOrder(currentCategory);
            const iconDesk = document.getElementById('sortIconDesk');
            const iconMob = document.getElementById('sortIconMob');

            const iconClass = order === 'asc' ? 'fa-solid fa-arrow-down-a-z' : 'fa-solid fa-arrow-down-z-a';
            if (iconDesk) iconDesk.className = iconClass + ' pointer-events-none';
            if (iconMob) iconMob.className = iconClass + ' pointer-events-none';
        }

        function updateViewButtonsStyle() {
            const mode = getViewMode(currentCategory);
            const gridBtnDesk = document.getElementById('btnGridDesk');
            const listBtnDesk = document.getElementById('btnListDesk');
            const gridBtnMob = document.getElementById('btnGridMob');
            const listBtnMob = document.getElementById('btnListMob');

            [gridBtnDesk, gridBtnMob].forEach(btn => {
                if (!btn) return;
                if (mode === 'grid') {
                    btn.classList.add('bg-white', 'shadow-sm', 'text-blue-600', 'font-semibold');
                    btn.classList.remove('text-gray-700');
                } else {
                    btn.classList.remove('bg-white', 'shadow-sm', 'text-blue-600', 'font-semibold');
                    btn.classList.add('text-gray-700');
                }
            });

            [listBtnDesk, listBtnMob].forEach(btn => {
                if (!btn) return;
                if (mode === 'list') {
                    btn.classList.add('bg-white', 'shadow-sm', 'text-blue-600', 'font-semibold');
                    btn.classList.remove('text-gray-700');
                } else {
                    btn.classList.remove('bg-white', 'shadow-sm', 'text-blue-600', 'font-semibold');
                    btn.classList.add('text-gray-700');
                }
            });
        }

        function toggleDropdown(id) {
            const el = document.getElementById(id);
            if (!el) return;

            });

            const oldCustom = categoryCustomizations[oldName];

        function handleCategoryIconFileSelect(e) {
            const input = e.target;
            const file = input.files[0];
            const catName = document.getElementById('editCategoryIconName').value;
            if (!file || !catName) { input.value = ''; return; }

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const size = 96;
                    const iw = img.naturalWidth || size;
                    const ih = img.naturalHeight || size;
                    const scale = Math.min(size / iw, size / ih);
                    const w = iw * scale, h = ih * scale;
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    canvas.getContext('2d').drawImage(img, (size - w) / 2, (size - h) / 2, w, h);

                    categoryCustomizations[catName] = { image: canvas.toDataURL('image/png') };
                    saveToStorage(true);
                    closeEditCategoryIconModal();
                    render();
                    input.value = '';
                };
                img.onerror = function() {
                    alert('Não foi possível ler esta imagem. Escolha outro arquivo.');
                    input.value = '';
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        function exportBackup() {
            const backupPayload = {
                shortcuts: htmlFiles,
                categories: categoryCustomizations,
                viewModes: categoryViewModes,
                sortOrders: categorySortOrders
            };
            const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
            const a = document.createElement('a');
            a.href = url;
            a.download = `links_backup_${stamp}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function triggerImportBackup() { document.getElementById('importFileInput').click(); }
        
        function handleImportBackup(e) {
            const input = e.target;
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const imported = JSON.parse(evt.target.result);
                    const incoming = Array.isArray(imported) ? imported : imported.shortcuts;
                    if (!Array.isArray(incoming)) throw new Error('Formato inválido');

                    const usedIds = new Set(htmlFiles.map(f => f.id));
                    const exists = (url, cat) => htmlFiles.some(f =>
                        String(f.file || '').trim().toLowerCase() === url.toLowerCase() &&
                        (f.category || 'Geral').trim() === cat);

                    let added = 0, skipped = 0;
                    incoming.forEach(raw => {
                        const url = normalizeUrl(raw && raw.file);
                        const title = String((raw && (raw.title || raw.name)) || '').trim();
                        const category = String((raw && raw.category) || 'Geral').trim() || 'Geral';
                        if (!url || !title || exists(url, category)) { skipped++; return; }

                        let id = raw.id && !usedIds.has(raw.id) ? raw.id : generateUniqueId();
                        usedIds.add(id);

                        htmlFiles.push({
                            ...raw,
                            id, title, name: title, file: url, category,
                            customIcon: raw.customIcon || '',
                            visitCount: raw.visitCount || 0,
                            isFavorite: !!raw.isFavorite,
                            showDesktop: raw.showDesktop !== false,
                            showMobile: raw.showMobile !== false
                        });
                        added++;
                    });

                    if (!Array.isArray(imported)) {
                        if (imported.categories && typeof imported.categories === 'object') Object.assign(categoryCustomizations, imported.categories);
                        if (imported.viewModes && typeof imported.viewModes === 'object') Object.assign(categoryViewModes, imported.viewModes);
                        if (imported.sortOrders && typeof imported.sortOrders === 'object') Object.assign(categorySortOrders, imported.sortOrders);
                    }

                    saveToStorage(true);
                    render();
                    alert(`${added} link(s) importado(s)` + (skipped ? `, ${skipped} ignorado(s) (já existiam ou eram inválidos).` : '.'));
                } catch (err) {
                    alert('Erro ao ler o arquivo. Use um backup .json exportado pelo aplicativo.');
                } finally {
                    input.value = '';
                }
            };
            reader.readAsText(file);
        }

        function confirmClearAllShortcuts() {
            if(confirm('Tem certeza que deseja apagar todos os atalhos?')) {
                htmlFiles = [];
                currentCategory = 'favorites';
                saveToStorage(true);
                render();
            }
        }

        function render() {
            renderCategories();
            renderGrid();
        }

        const LICENSE_EXPIRED_MESSAGE = 'Cópia não registrada, entrar em contato com o desenvolvedor pelo telefone: 82987340685 para regularização da licença';

        function applyUser(email) {
            if (typeof azlinksBuscarUsuario !== 'function') return false;
            const user = azlinksBuscarUsuario(email);
            if (!user) return false;

            if (user.vencida) {
                APPS_SCRIPT_URL = '';
                APPS_SCRIPT_PLANILHA = '';
                return 'expired';
            }

            const previousEmail = localStorage.getItem('local_user_email');
            if (previousEmail && previousEmail !== user.email) {
                htmlFiles = [];
                categoryCustomizations = {};
                currentCategory = 'favorites';
                saveToStorage(false);
                pendingPush = false;
                idbSetMany({ dirty: 'false' });
            }

            APPS_SCRIPT_URL = user.url;
            APPS_SCRIPT_PLANILHA = user.planilha;
            localStorage.setItem('local_user_email', user.email);

            const footerName = document.getElementById('footerLicenseName');
            if (footerName) footerName.textContent = user.nome;
            return true;
        }

        function getExpectedPassword() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}${month}${day}`;
        }

        function openEmailModal(canCancel, message) {
            const input = document.getElementById('loginEmail');
            const passInput = document.getElementById('loginPassword');
            const error = document.getElementById('loginEmailError');
            const cancelBtn = document.getElementById('emailCancelBtn');
            input.value = localStorage.getItem('local_user_email') || '';
            passInput.value = '';
            if (message) {
                error.textContent = message;
                error.classList.remove('hidden');
            } else {
                error.classList.add('hidden');
            }
            cancelBtn.classList.toggle('hidden', !canCancel);
            document.getElementById('emailModal').classList.remove('hidden');
            input.focus();
        }

        function closeEmailModal() {
            document.getElementById('emailModal').classList.add('hidden');
        }

        function showLicenseBlock() {
            closeAllDropdowns();
            document.getElementById('licenseBlockMessage').textContent = LICENSE_EXPIRED_MESSAGE;
            document.getElementById('licenseBlock').classList.remove('hidden');
        }

        function useAnotherEmail() {
            document.getElementById('licenseBlock').classList.add('hidden');
            openEmailModal(false);
        }

        async function handleEmailSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value.trim();
            const error = document.getElementById('loginEmailError');

            const expectedPass = getExpectedPassword();
            if (password !== expectedPass) {
                error.textContent = 'Senha incorreta.';
                error.classList.remove('hidden');
                return;
            }

            const result = applyUser(email);
            if (result === 'expired') {
                closeEmailModal();
                showLicenseBlock();
                return;
            }
            if (result !== true) {
                error.textContent = 'E-mail não cadastrado. Entre em contato com o desenvolvedor.';
                error.classList.remove('hidden');
                return;
            }

            closeEmailModal();
            render();
            await syncFromGoogleSheets();
            startAutoSync();
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && isSyncConfigured()) {
                syncFromGoogleSheets();
            }
        });

        window.addEventListener('online', () => {
            if (isSyncConfigured()) syncFromGoogleSheets();
        });

        window.onload = async function() {
            await loadLocalData();
            render();
            const savedEmail = localStorage.getItem('local_user_email');
            const result = savedEmail ? applyUser(savedEmail) : false;
            if (result === true) {
                await syncFromGoogleSheets();
                startAutoSync();
            } else if (result === 'expired') {
                showLicenseBlock();
            } else {
                openEmailModal(false);
            }
        };
    </script>
</body>
</html>
