<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cadastro de Usuários</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 1rem; line-height: 1.5; }
        .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }

        .top-bar { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
        .top-bar h1 { font-size: 1.15rem; color: #0f172a; }
        .btn-novo {
            background: #fff; color: var(--danger); border: 1px solid var(--danger);
            padding: .5rem 1.25rem; font-weight: bold; border-radius: 6px; cursor: pointer;
            text-transform: uppercase; font-size: .875rem; letter-spacing: .5px; transition: all .2s;
        }
        .btn-novo:hover { background: var(--danger); color: #fff; }

        .panel { background: var(--card-bg); padding: 1rem; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); border: 1px solid var(--border); }
        .search-container { position: relative; display: flex; align-items: center; }
        .search-icon { position: absolute; left: .8rem; color: #94a3b8; pointer-events: none; }
        input { padding: .6rem .8rem; border: 1px solid var(--border); border-radius: 6px; font-size: .95rem; outline: none; width: 100%; transition: border-color .2s; }
        input:focus { border-color: var(--primary); }
        input[readonly] { background: #f1f5f9; color: var(--muted); }
        .search-container input { padding-left: 2.5rem; }

        .count { font-size: .8rem; color: var(--muted); }

        /* Visualização em cards */
        .cards { display: grid; grid-template-columns: 1fr; gap: .75rem; }
        @media (min-width: 640px) { .cards { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 960px) { .cards { grid-template-columns: repeat(3, 1fr); } }

        .user-card {
            position: relative; background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 10px; padding: 1rem 1rem .9rem; box-shadow: 0 1px 3px rgba(0,0,0,.06);
            display: flex; flex-direction: column; gap: .35rem; min-width: 0;
        }
        .user-card.expired { border-left: 4px solid var(--danger); }
        .user-card.active { border-left: 4px solid #10b981; }
        .user-name { font-weight: 700; font-size: 1rem; padding-right: 2.5rem; overflow-wrap: anywhere; }
        .user-email { font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
        .row { display: flex; align-items: baseline; gap: .4rem; font-size: .8rem; min-width: 0; }
        .row .lbl { color: var(--muted); flex-shrink: 0; }
        .row code { background: #f1f5f9; padding: .1rem .35rem; border-radius: 4px; font-size: .75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .badge { align-self: flex-start; margin-top: .25rem; padding: .2rem .55rem; border-radius: 4px; font-size: .72rem; font-weight: bold; }
        .badge-active { background: #d1fae5; color: #065f46; }
        .badge-expired { background: #fee2e2; color: #991b1b; }

        /* Menu de três pontinhos */
        .menu { position: absolute; top: .55rem; right: .55rem; }
        .dropbtn {
            background: #f1f5f9; color: #334155; border: 1px solid var(--border); border-radius: 6px;
            width: 2rem; height: 2rem; font-size: 1.1rem; font-weight: bold; cursor: pointer; line-height: 1;
        }
        .dropbtn:hover { background: #e2e8f0; }
        .dropdown-content {
            display: none; position: absolute; right: 0; top: 2.3rem; min-width: 130px; background: #fff;
            border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.15);
            z-index: 20; overflow: hidden;
        }
        .menu.show .dropdown-content { display: block; }
        .dropdown-content button {
            display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
            padding: .6rem .75rem; font-size: .85rem; color: var(--text);
        }
        .dropdown-content button:hover { background: #f1f5f9; }
        .dropdown-content button.danger { color: var(--danger); }
        .dropdown-content button.danger:hover { background: #fee2e2; }

        /* Computador (a partir de 768px): tabela. Celular: cards. */
        .table-view { display: none; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
        .table-view table { width: 100%; border-collapse: collapse; }
        .table-view th, .table-view td { text-align: left; padding: .7rem .85rem; border-bottom: 1px solid var(--border); font-size: .88rem; vertical-align: middle; }
        .table-view th { background: #f1f5f9; font-size: .8rem; text-transform: uppercase; letter-spacing: .3px; color: #475569; }
        .table-view thead th:first-child { border-top-left-radius: 8px; }
        .table-view thead th:last-child { border-top-right-radius: 8px; }
        .table-view tbody tr:last-child td { border-bottom: none; }
        .table-view tbody tr:hover { background: #f8fafc; }
        .table-view td.col-plan code { display: inline-block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; background: #f1f5f9; padding: .1rem .35rem; border-radius: 4px; font-size: .75rem; }
        .table-view .col-acoes { width: 70px; text-align: center; }
        .table-view .badge { margin-top: 0; }
        .table-view .menu { position: relative; top: auto; right: auto; display: inline-block; }
        @media (min-width: 768px) {
            .cards { display: none; }
            .table-view { display: block; }
        }

        .empty { text-align: center; color: var(--muted); padding: 2rem 1rem; }

        /* Botões */
        button { font-weight: 600; }
        .btn { padding: .6rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; transition: background-color .2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #64748b; color: #fff; }
        .btn-secondary:hover { background: #475569; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn:disabled { opacity: .6; cursor: not-allowed; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #fff; padding: 1.25rem; border-radius: 8px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 2px solid var(--border); padding-bottom: .5rem; }
        .modal-header h2 { font-size: 1.1rem; }
        .close-btn { background: none; border: none; font-size: 1.5rem; color: var(--muted); cursor: pointer; padding: 0 .5rem; }
        .close-btn:hover { color: var(--danger); }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: .9rem; }
        .form-group { display: flex; flex-direction: column; gap: .3rem; }
        label { font-size: .85rem; font-weight: 600; }
        .hint { font-size: .75rem; color: var(--muted); font-weight: 400; }
        .btn-group { margin-top: 1.1rem; display: flex; gap: .5rem; justify-content: flex-end; flex-wrap: wrap; }
        .error { color: #b91c1c; font-size: .82rem; margin-top: .6rem; display: none; }
        .error.show { display: block; }
        .modal-text { font-size: .95rem; color: #334155; overflow-wrap: anywhere; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1>Cadastros Usuários</h1>
        <button type="button" class="btn-novo" onclick="abrirModalNovo()">Novo</button>
    </div>

    <div class="panel">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="search" id="buscaNome" placeholder="Pesquisar nome" oninput="render()">
        </div>
    </div>

    <div class="count" id="contador"></div>
    <div class="cards" id="cards"></div>
    <div class="table-view" id="tabelaWrap">
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>ID da planilha</th>
                    <th>Validade</th>
                    <th>Status</th>
                    <th class="col-acoes">Ações</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
    <div class="empty" id="vazio" style="display:none;">Nenhum usuário encontrado.</div>
</div>

<!-- Acesso do administrador -->
<div class="modal-overlay" id="modalChave">
    <div class="modal-card">
        <div class="modal-header"><h2>Acesso do administrador</h2></div>
        <form onsubmit="entrar(event)">
            <div class="form-group">
                <label for="chave">Chave de administrador</label>
                <input type="password" id="chave" autocomplete="current-password" required>
            </div>
            <p class="error" id="chaveErro"></p>
            <div class="btn-group">
                <button type="submit" class="btn btn-primary" id="btnEntrar">Entrar</button>
            </div>
        </form>
    </div>
</div>

<!-- Cadastrar / Editar -->
<div class="modal-overlay" id="modalForm">
    <div class="modal-card">
        <div class="modal-header">
            <h2 id="modalTitulo">Cadastrar Usuário</h2>
            <button type="button" class="close-btn" onclick="fecharModais()">&times;</button>
        </div>
        <form id="formUsuario">
            <div class="form-grid">
                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" placeholder="usuario@exemplo.com" required autocapitalize="none">
                </div>
                <div class="form-group">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" placeholder="Nome do Titular" required>
                </div>
                <div class="form-group">
                    <label for="planilha">Link ou ID da Planilha do Google *</label>
                    <input type="text" id="planilha" placeholder="" required autocomplete="off" autocapitalize="none" spellcheck="false">
                </div>
                <div class="form-group">
                    <label for="validade">Validade <span class="hint">(deixe vazio para sem vencimento)</span></label>
                    <input type="date" id="validade">
                </div>
            </div>
            <p class="error" id="formErro"></p>
            <div class="btn-group">
                <button type="button" class="btn btn-secondary" onclick="fecharModais()">Cancelar</button>
                <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar Usuário</button>
            </div>
        </form>
    </div>
</div>

<!-- Confirmar exclusão -->
<div class="modal-overlay" id="modalExcluir">
    <div class="modal-card">
        <div class="modal-header">
            <h2>Confirmar exclusão</h2>
            <button type="button" class="close-btn" onclick="fecharModais()">&times;</button>
        </div>
        <p class="modal-text" id="textoExcluir"></p>
        <p class="error" id="excluirErro"></p>
        <div class="btn-group">
            <button type="button" class="btn btn-secondary" onclick="fecharModais()">Cancelar</button>
            <button type="button" class="btn btn-danger" id="btnExcluir">Excluir</button>
        </div>
    </div>
</div>

<script>
    // URL do Web App do Apps Script (a mesma usada no index.html, termina em /exec)
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby7bScgVxp5wJxV0KZ26kvU0Awd8az-pMZXSg8kTM137bvnQxQxvgpXJ39zutU8gC_Xew/exec';

    let usuarios = [];
    let chaveAdmin = sessionStorage.getItem('azlinks_admin_chave') || '';
    let emailEmEdicao = null;   // null = novo cadastro
    let emailParaExcluir = null;

    const $ = id => document.getElementById(id);

    function esc(v) {
        return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function hojeIso() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function formatarData(iso) {
        const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
        return m ? m[3] + '/' + m[2] + '/' + m[1] : '';
    }

    // ===== Comunicação com o Apps Script =====
    async function chamar(op, extra) {
        if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL === 'SUA_URL_DO_APPS_SCRIPT_AQUI') {
            throw new Error('Preencha APPS_SCRIPT_URL no gerenciador.html com a URL do Web App.');
        }
        let res;
        try {
            // text/plain evita a pré-verificação CORS, que o Apps Script não responde
            res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(Object.assign({ acao: 'admin', op: op, chave: chaveAdmin }, extra || {}))
            });
        } catch (err) {
            throw new Error('Não foi possível conectar ao Apps Script. Confira a internet e a URL.');
        }
        let data;
        try { data = await res.json(); }
        catch (err) { throw new Error('Resposta inesperada do Apps Script. Confira se a implantação está atualizada.'); }
        if (data.status !== 'success') throw new Error(data.message || 'Erro no Apps Script');
        usuarios = data.usuarios || [];
        return data;
    }

    // ===== Acesso =====
    function mostrarErro(id, msg) {
        const el = $(id);
        el.textContent = msg || '';
        el.classList.toggle('show', !!msg);
    }

    async function entrar(e) {
        if (e) e.preventDefault();
        chaveAdmin = $('chave').value;
        const btn = $('btnEntrar');
        btn.disabled = true;
        mostrarErro('chaveErro', '');
        try {
            await chamar('listar');
            sessionStorage.setItem('azlinks_admin_chave', chaveAdmin);
            $('modalChave').classList.remove('active');
            $('chave').value = '';
            render();
        } catch (err) {
            chaveAdmin = '';
            mostrarErro('chaveErro', err.message);
        } finally {
            btn.disabled = false;
        }
    }

    // ===== Lista em cards =====
    function render() {
        const termo = $('buscaNome').value.trim().toLowerCase();
        const hoje = hojeIso();
        const lista = usuarios.filter(u => !termo || u.nome.toLowerCase().includes(termo) || u.email.toLowerCase().includes(termo));

        $('contador').textContent = lista.length + (lista.length === 1 ? ' usuário' : ' usuários');
        $('vazio').style.display = lista.length ? 'none' : 'block';

        const menuHtml = u => `
            <div class="menu">
                <button type="button" class="dropbtn" data-menu title="Ações">⋮</button>
                <div class="dropdown-content">
                    <button type="button" data-editar="${esc(u.email)}">Editar</button>
                    <button type="button" class="danger" data-excluir="${esc(u.email)}">Excluir</button>
                </div>
            </div>`;

        $('tbody').innerHTML = lista.map(u => {
            const vencida = !!u.validade && hoje > u.validade;
            return `
                <tr>
                    <td><strong>${esc(u.nome)}</strong></td>
                    <td>${esc(u.email)}</td>
                    <td class="col-plan"><code title="${esc(u.planilha)}">${esc(u.planilha)}</code></td>
                    <td>${u.validade ? esc(formatarData(u.validade)) : '<em>Sem vencimento</em>'}</td>
                    <td><span class="badge ${vencida ? 'badge-expired' : 'badge-active'}">${vencida ? 'Vencida' : 'Ativa'}</span></td>
                    <td class="col-acoes">${menuHtml(u)}</td>
                </tr>`;
        }).join('');

        $('cards').innerHTML = lista.map(u => {
            const vencida = !!u.validade && hoje > u.validade;
            return `
                <div class="user-card ${vencida ? 'expired' : 'active'}">
                    <div class="menu">
                        <button type="button" class="dropbtn" data-menu title="Ações">⋮</button>
                        <div class="dropdown-content">
                            <button type="button" data-editar="${esc(u.email)}">Editar</button>
                            <button type="button" class="danger" data-excluir="${esc(u.email)}">Excluir</button>
                        </div>
                    </div>
                    <div class="user-name">${esc(u.nome)}</div>
                    <div class="user-email">${esc(u.email)}</div>
                    <div class="row"><span class="lbl">Planilha:</span><code title="${esc(u.planilha)}">${esc(u.planilha)}</code></div>
                    <div class="row"><span class="lbl">Validade:</span><span>${u.validade ? esc(formatarData(u.validade)) : '<em>Sem vencimento</em>'}</span></div>
                    <span class="badge ${vencida ? 'badge-expired' : 'badge-active'}">${vencida ? 'Vencida' : 'Ativa'}</span>
                </div>`;
        }).join('');
    }

    // Menu de três pontinhos e ações (delegação de eventos)
    document.addEventListener('click', e => {
        const menuBtn = e.target.closest('[data-menu]');
        document.querySelectorAll('.menu.show').forEach(m => { if (!menuBtn || m !== menuBtn.parentElement) m.classList.remove('show'); });
        if (menuBtn) { menuBtn.parentElement.classList.toggle('show'); return; }

        const ed = e.target.closest('[data-editar]');
        if (ed) { abrirModalEditar(ed.getAttribute('data-editar')); return; }
        const ex = e.target.closest('[data-excluir]');
        if (ex) { abrirModalExcluir(ex.getAttribute('data-excluir')); return; }

        if (e.target.classList.contains('modal-overlay') && e.target.id !== 'modalChave') fecharModais();
    });

    // ===== Cadastro / edição =====
    function abrirModalNovo() {
        emailEmEdicao = null;
        $('formUsuario').reset();
        $('email').readOnly = false;
        $('modalTitulo').textContent = 'Cadastrar Usuário';
        mostrarErro('formErro', '');
        $('modalForm').classList.add('active');
        setTimeout(() => $('email').focus(), 50);
    }

    function abrirModalEditar(email) {
        const u = usuarios.find(x => x.email === email);
        if (!u) return;
        emailEmEdicao = email;
        $('email').value = u.email;
        $('email').readOnly = true;
        $('nome').value = u.nome;
        $('planilha').value = u.planilha;
        $('validade').value = u.validade || '';
        $('modalTitulo').textContent = 'Editar Usuário';
        mostrarErro('formErro', '');
        $('modalForm').classList.add('active');
        setTimeout(() => $('nome').focus(), 50);
    }

    $('formUsuario').addEventListener('submit', async e => {
        e.preventDefault();
        const email = $('email').value.trim().toLowerCase();
        // Impede duplicar um e-mail já cadastrado ao criar um novo
        if (emailEmEdicao === null && usuarios.some(u => u.email === email)) {
            mostrarErro('formErro', 'Este e-mail já está cadastrado. Use a opção Editar no cartão dele.');
            return;
        }
        const btn = $('btnSalvar');
        btn.disabled = true;
        mostrarErro('formErro', '');
        try {
            await chamar('salvar', {
                usuario: {
                    email: email,
                    nome: $('nome').value.trim(),
                    planilha: $('planilha').value.trim(),
                    validade: $('validade').value
                }
            });
            fecharModais();
            render();
        } catch (err) {
            mostrarErro('formErro', err.message);
        } finally {
            btn.disabled = false;
        }
    });

    // ===== Exclusão =====
    function abrirModalExcluir(email) {
        const u = usuarios.find(x => x.email === email);
        if (!u) return;
        emailParaExcluir = email;
        $('textoExcluir').textContent = 'Deseja excluir o usuário ' + u.nome + ' (' + u.email + ')?';
        mostrarErro('excluirErro', '');
        $('modalExcluir').classList.add('active');
    }

    $('btnExcluir').addEventListener('click', async () => {
        if (!emailParaExcluir) return;
        const btn = $('btnExcluir');
        btn.disabled = true;
        mostrarErro('excluirErro', '');
        try {
            await chamar('excluir', { email: emailParaExcluir });
            fecharModais();
            render();
        } catch (err) {
            mostrarErro('excluirErro', err.message);
        } finally {
            btn.disabled = false;
        }
    });

    function fecharModais() {
        ['modalForm', 'modalExcluir'].forEach(id => $(id).classList.remove('active'));
        $('formUsuario').reset();
        emailEmEdicao = null;
        emailParaExcluir = null;
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModais(); });

    // ===== Início =====
    (async function iniciar() {
        if (chaveAdmin) {
            try {
                await chamar('listar');
                render();
                return;
            } catch (err) {
                chaveAdmin = '';
                sessionStorage.removeItem('azlinks_admin_chave');
            }
        }
        $('modalChave').classList.add('active');
        setTimeout(() => $('chave').focus(), 50);
    })();
</script>

</body>
</html>
